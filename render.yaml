services:
  - type: web
    name: carnatic-app
    env: python
    buildCommand: pip install -r requirements.txt
    # Worker count and timeout live in gunicorn.conf.py (auto-loaded from the
    # repo root), NOT here — the running service uses a dashboard Start Command
    # of "gunicorn app:app", so flags added to this line would be ignored. Keep
    # this matching the dashboard so it isn't misleading. Edit gunicorn.conf.py
    # to change workers/timeout.
    startCommand: gunicorn app:app
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
